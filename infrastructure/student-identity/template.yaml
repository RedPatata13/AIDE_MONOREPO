AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AIDE — Student Identity Service

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        DB_HOST: !Ref DBHost
        DB_PORT: !Ref DBPort
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUser
        DB_PASSWORD: !Ref DBPassword
        EVENT_BUS_NAME: !ImportValue
          !Sub aide-identity-bus-name-${Environment}
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  DBHost:
    Type: String
  DBPort:
    Type: String
    Default: "5432"
  DBName:
    Type: String
  DBUser:
    Type: String
  DBPassword:
    Type: String
    NoEcho: true
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String

Resources:

  StudentApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment

  # --- Handlers ---
  GetStudentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/getStudents.handler"]
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref StudentApi
            Path: /students
            Method: GET
    Metadata:
      DockerTag: student-identity
      DockerContext: ../../services/student-identity
      Dockerfile: Dockerfile

  CreateStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/createStudent.handler"]
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref StudentApi
            Path: /students
            Method: POST
    Metadata:
      DockerTag: student-identity
      DockerContext: ../../services/student-identity
      Dockerfile: Dockerfile

  GetStudentByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/getStudentById.handler"]
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref StudentApi
            Path: /students/{id}
            Method: GET
    Metadata:
      DockerTag: student-identity
      DockerContext: ../../services/student-identity
      Dockerfile: Dockerfile

  UpdateStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/updateStudent.handler"]
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref StudentApi
            Path: /students/{id}
            Method: PUT
    Metadata:
      DockerTag: student-identity
      DockerContext: ../../services/student-identity
      Dockerfile: Dockerfile

  DeleteStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/deleteStudent.handler"]
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref StudentApi
            Path: /students/{id}
            Method: DELETE
    Metadata:
      DockerTag: student-identity
      DockerContext: ../../services/student-identity
      Dockerfile: Dockerfile

  # --- Event Listeners ---
  StudentCreatedListenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/listeners/studentCreated.handler"]
      Events:
        StudentCreatedEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
            Pattern:
              source:
                - aide.identity.student
              detail-type:
                - student.created
    Metadata:
      DockerTag: student-identity
      DockerContext: ../../services/student-identity
      Dockerfile: Dockerfile

Outputs:
  StudentApiUrl:
    Value: !Sub https://${StudentApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub aide-student-api-url-${Environment}