AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AIDE — Teacher Identity Service

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        NODE_ENV: !Ref Environment
        DB_HOST: !Ref DBHost
        DB_PORT: !Ref DBPort
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUser
        DB_PASSWORD: !Ref DBPassword
        EVENT_BUS_NAME: !ImportValue
          !Sub aide-identity-bus-name-${Environment}
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
  DBHost:
    Type: String
  DBPort:
    Type: String
    Default: "5432"
  DBName:
    Type: String
  DBUser:
    Type: String
  DBPassword:
    Type: String
    NoEcho: true
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String

Resources:

  TeacherApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment

  # --- Handlers ---
  GetTeachersFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/getTeachers.handler"]
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeacherApi
            Path: /teachers
            Method: GET
    Metadata:
      DockerTag: teacher-identity
      DockerContext: ../../services/teacher-identity
      Dockerfile: Dockerfile

  CreateTeacherFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/createTeacher.handler"]
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeacherApi
            Path: /teachers
            Method: POST
    Metadata:
      DockerTag: teacher-identity
      DockerContext: ../../services/teacher-identity
      Dockerfile: Dockerfile

  GetTeacherByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/getTeacherById.handler"]
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeacherApi
            Path: /teachers/{id}
            Method: GET
    Metadata:
      DockerTag: teacher-identity
      DockerContext: ../../services/teacher-identity
      Dockerfile: Dockerfile

  UpdateTeacherFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/updateTeacher.handler"]
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeacherApi
            Path: /teachers/{id}
            Method: PUT
    Metadata:
      DockerTag: teacher-identity
      DockerContext: ../../services/teacher-identity
      Dockerfile: Dockerfile

  DeleteTeacherFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/deleteTeacher.handler"]
      Policies:
        - EventBridgePutEventsPolicy:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref TeacherApi
            Path: /teachers/{id}
            Method: DELETE
    Metadata:
      DockerTag: teacher-identity
      DockerContext: ../../services/teacher-identity
      Dockerfile: Dockerfile

  # --- Event Listeners ---
  TeacherCreatedListenerFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers/listeners/teacherCreated.handler"]
      Events:
        TeacherCreatedEvent:
          Type: EventBridgeRule
          Properties:
            EventBusName: !ImportValue
              !Sub aide-identity-bus-name-${Environment}
            Pattern:
              source:
                - aide.identity.teacher
              detail-type:
                - teacher.created
    Metadata:
      DockerTag: teacher-identity
      DockerContext: ../../services/teacher-identity
      Dockerfile: Dockerfile

Outputs:
  TeacherApiUrl:
    Value: !Sub https://${TeacherApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub aide-teacher-api-url-${Environment}