version: '3.8'

services:
  student-db:
    image: postgres:16
    container_name: aide-student-db
    environment:
      POSTGRES_DB: aide_student_dev
      POSTGRES_USER: aide_student
      POSTGRES_PASSWORD: ${DB_STUDENT_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - student-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aide_student -d aide_student_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  teacher-db:
    image: postgres:16
    container_name: aide-teacher-db
    environment:
      POSTGRES_DB: aide_teacher_dev
      POSTGRES_USER: aide_teacher
      POSTGRES_PASSWORD: ${DB_TEACHER_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - teacher-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aide_teacher -d aide_teacher_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin-db:
    image: postgres:16
    container_name: aide-admin-db
    environment:
      POSTGRES_DB: aide_admin_dev
      POSTGRES_USER: aide_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - admin-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aide_admin -d aide_admin_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  student-db-data:
  teacher-db-data:
  admin-db-data: